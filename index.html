<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMI :3</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%;
            width: 100%;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: clamp(16px, 4vw, 48px);
            background-color: #f5d2c4;
            background-image:
                linear-gradient(125deg, rgba(255, 231, 199, 0.72) 0%, rgba(248, 190, 207, 0.68) 48%, rgba(207, 225, 190, 0.72) 100%),
                url('img/amar.png');
            background-blend-mode: multiply;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            font-family: 'Arial', sans-serif;
        }

        body > div {
            width: min(100%, 1000px);
        }

        h1, h2 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-align: center;
            overflow-wrap: anywhere;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 6rem);
            animation: fadeInOut 3s infinite; /* Animación suave */
        }

        h2 {
            font-size: clamp(1.25rem, 4vw, 3rem);
            margin-top: 20px;
            animation: pulse 2s infinite; /* Pequeño efecto de pulsación */
        }

        button {
            display: block;
            max-width: 100%;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            padding: 15px 30px;
            margin-top: 30px;
            border: none;
            margin-inline: auto;
            background-color: #ff3366;
            color: white;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: clamp(2.2rem, 11vw, 3.25rem);
            }

            h2 {
                font-size: clamp(1.2rem, 6vw, 1.75rem);
            }

            button {
                padding: 14px 24px;
            }
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div>
        <h1>NOEMI💕💕💕</h1>
        <h2>Tengo un regalo para ti</h2>
        <button onclick="window.location.href='rosas.html'">Ver regalo 💛</button>
    </div>
</body>
</html>
